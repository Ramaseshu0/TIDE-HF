[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chf_titration"
version = "0.1.0"
description = "CHF GDMT titration pipeline: classifier + rule engine + strategy + local UI"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14",
    "groq>=0.11",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
ui  = ["streamlit>=1.30"]
mcp = ["mcp[cli]>=1.0"]
rag = [
    "chromadb>=0.4",
    "sentence-transformers>=2.5",
    "pypdf>=4.0",
    "cryptography>=3.1",
    "python-docx>=1.1",
    "requests>=2.31",
]
dev = ["pytest>=7", "ruff>=0.3"]

[project.scripts]
chf-generate-data = "chf_titration.cli:generate_data_cli"
chf-train         = "chf_titration.cli:train_cli"
chf-prepare       = "chf_titration.cli:prepare_cli"
chf-ui            = "chf_titration.cli:ui_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chf_titration" = ["data/*.csv"]
