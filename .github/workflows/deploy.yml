name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        # Try the strict, reproducible install first. If the lockfile has
        # drifted in any way that npm ci refuses (very common after
        # cross-platform installs or peer-dep bumps), fall back to a
        # normal npm install so the deploy still ships.
        run: |
          npm ci --no-audit --no-fund --prefer-offline \
            || (echo "::warning::npm ci failed, falling back to npm install" \
                && rm -rf node_modules package-lock.json \
                && npm install --no-audit --no-fund)

      - name: Build
        # VITE_TIDE_API points the deployed site at the live RAG backend.
        # Set it as a repo Variable (Settings → Secrets and variables →
        # Actions → Variables) to your ngrok URL, e.g.
        # https://your-name.ngrok-free.app  — leave unset to fall back to
        # browser-only mode (no live RAG).
        run: npm run build
        env:
          VITE_TIDE_API: ${{ vars.VITE_TIDE_API }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
